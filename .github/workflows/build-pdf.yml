# Reusable workflow - the single "one place" implementation.
#
# Any project repo (same GitHub account or another) can run this with a tiny:
#
#   on:
#     push: { paths: ['*.md'] }
#     workflow_dispatch:
#   jobs:
#     pdf:
#       uses: saptarshi-sen1/md_to_pdf/.github/workflows/build-pdf.yml@v1
#       with:
#         input:  'UiPath_Handbook.md'
#         output: 'UiPath_Handbook.pdf'
#
# Nothing is copied into the caller's repo - everyone points here.

name: Build Markdown PDF

on:
  workflow_call:
    inputs:
      input:
        description: 'Path to the Markdown file (relative to the caller repo root).'
        type: string
        required: false
        default: 'UiPath_Handbook.md'
      output:
        description: 'Output PDF path (relative to caller repo root). Defaults to <input>.pdf.'
        type: string
        required: false
        default: ''
    outputs:
      pdf:
        description: 'Relative path of the generated PDF.'
        value: ${{ jobs.build-pdf.outputs.pdf_path }}

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    outputs:
      pdf_path: ${{ steps.emit.outputs.pdf }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout tool repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/md_to_pdf
          path: .mdpdf-tool

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install headless-Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 fonts-liberation

      - name: Install tool dependencies
        working-directory: .mdpdf-tool
        run: npm ci --no-audit --no-fund

      - name: Build PDF
        run: |
          if [ -n "${{ inputs.output }}" ]; then
            node .mdpdf-tool/build-pdf.js "${{ inputs.input }}" "${{ inputs.output }}"
          else
            node .mdpdf-tool/build-pdf.js "${{ inputs.input }}"
          fi

      - name: Emit output path
        id: emit
        run: |
          if [ -n "${{ inputs.output }}" ]; then
            echo "pdf=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
          else
            echo "pdf=$(basename "${{ inputs.input }}" .md).pdf" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-build
          path: ${{ steps.emit.outputs.pdf }}

      - name: Attach PDF to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.emit.outputs.pdf }}
          generate_release_notes: true